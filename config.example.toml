# 使用 --config PATH 或 MAGNET_CONFIG 显式加载；配置会替换默认 Provider 列表。
[[providers]]
name = "nyaa"
kind = "nyaa"
url = "https://nyaa.si/"

[[providers]]
name = "knaben"
kind = "knaben"
url = "https://api.knaben.org/v1"

[[providers]]
name = "apibay"
kind = "apibay"
url = "https://apibay.org/q.php"

[[providers]]
name = "bitsearch"
kind = "bitsearch"
url = "https://bitsearch.eu/api/v1/search"
# 可选：免费匿名额度为每 IP 每日 200 次；配置 API key 可提高额度。
# api_key_env = "BITSEARCH_API_KEY"

# 取消以下条目的注释，并填写 Jackett/Prowlarr 提供的完整 Torznab API endpoint。
# api_key_env 是环境变量名称；运行前 export TORZNAB_API_KEY=你的密钥。
# [[providers]]
# name = "local"
# kind = "torznab"
# url = "http://localhost:9117/api/v2.0/indexers/all/results/torznab/api"
# api_key_env = "TORZNAB_API_KEY"

# RSS/Atom 原样请求 URL，在本地按标题匹配所有搜索词（忽略大小写）。
# example.org 是占位地址，需替换为实际 feed URL。
# [[providers]]
# name = "linux"
# kind = "rss"
# url = "https://example.org/torrents.rss"

# Sukebei（Nyaa NSFW），参与默认搜索；也可通过 --source sukebei 单独选择。
[[providers]]
name = "sukebei"
kind = "sukebei"
url = "https://sukebei.nyaa.si/"
default_search = true
