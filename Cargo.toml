[package]
name = "magnet-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Concurrent torrent search and magnet resolver"
license = "MIT"
repository = "https://github.com/wustites/magnet-cli"
readme = "README.md"
keywords = ["torrent", "magnet", "bittorrent", "cli", "search"]
categories = ["command-line-utilities"]

[[bin]]
name = "magnet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
directories = "6"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
url = "2"
